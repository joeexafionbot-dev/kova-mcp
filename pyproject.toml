[project]
name = "mygekko-mcp"
version = "0.0.1"
description = "MCP server for myGEKKO building controllers via the REST Query API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # <2 gepinnt: mcp 2.x entfernt mcp.server.fastmcp — ungepinnt wurde CI rot,
    # ohne dass sich Code geaendert hat (empirisch verifiziert 19.08.2026).
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
mygekko-mcp = "mygekko_mcp.__main__:main"
dump-inventory = "mygekko_mcp.scripts.dump_inventory:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mygekko_mcp"]

# --- standalone dev tooling (mirror repo) ------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

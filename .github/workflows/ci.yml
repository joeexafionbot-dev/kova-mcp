name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false
      - run: uv python install 3.11
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run pytest -q
